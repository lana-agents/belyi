# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "belyi"
  description: >-
    A Lean 4 / Mathlib formalization of Belyi's theorem and of Mochizuki's noncritical Belyi maps.
    Scheme-theoretically: a smooth projective geometrically connected curve over an algebraically
    closed field K of characteristic zero (e.g. ℂ) is definable over ℚ̄ if and only if it admits a
    finite morphism to ℙ¹ branched only over {0, 1, ∞}. Both directions are proved, the converse via
    the Riemann existence theorem of lana-agents/oka, together with invariance under base change and
    isomorphism and a marked-curve form sending a prescribed finite set of closed points into
    {0, 1, ∞}. Independently, curves over number fields are treated through their function fields
    (places, divisors, Riemann's theorem, canonical divisors and Riemann–Hurwitz, the Belyi relation,
    Kummer–Fermat coverings), and Mochizuki's noncritical Belyi maps are proved in the case S = ∅:
    for every finite set T of places there is a Belyi function none of whose cusps lies in T.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "On Galois extensions of a maximal cyclotomic field"
    authors: ["G. V. Belyi"]
    type: "article"
    location: "Izv. Akad. Nauk SSSR Ser. Mat. 43 (1979), 267-276"
    relationship: "formalizes"
    note: >-
      Belyi's theorem. The forward direction (definable over ℚ̄ ⇒ Belyi map) follows the polynomial
      reduction argument; the converse uses the Riemann existence theorem (via lana-agents/oka) and
      descent of finite étale covers. The proof outline with statement labels is
      references/proof-outline.md.
    author_endorsement: "n/a"
  - title: "Noncritical Belyi maps"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    location: "Math. J. Okayama Univ. 46 (2004), Lemmas 2.1-2.4 and Theorem 2.5"
    relationship: "formalizes"
    note: "Only the case S = ∅ of Theorem 2.5 is formalized (see fidelity.divergences)."
    author_endorsement: "not-contacted"
  - title: "Revêtements étales et groupe fondamental (SGA 1), Exposé XII"
    authors: ["Alexander Grothendieck", "Michèle Raynaud"]
    id: "arXiv:math/0206203"
    type: "book"
    location: "Exposé XII, Théorème 5.1 (Riemann existence theorem)"
    relationship: "background"
    note: "Used through its formalization in lana-agents/oka, not re-proved here."
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lana-agents/oka"
    relationship: "builds-on"
    note: >-
      Lake dependency (pinned da228a2); the converse of Belyi's theorem uses oka's Riemann existence
      theorem.
  - id: "https://github.com/lana-agents/heights"
    relationship: "other"
    note: "Used by: heights requires belyi at 9ce4d3f for Belyi.CurveField."
  - id: "https://github.com/lana-agents/genl"
    relationship: "other"
    note: >-
      Used by the lana-agents fork of genl through heights (height theory of curves and the Belyi
      descent of Genl.Curves).
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "iut pins belyi at 9ce4d3f as a transitive dependency; it does not use the library directly."

classification:
  arxiv: ["math.AG", "math.NT"]
  msc2020: ["14H25", "14H30", "11G32", "14H05"]

